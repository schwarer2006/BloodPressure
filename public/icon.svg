<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0284c7" />
      <stop offset="100%" stopColor="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bpGrad)" />

  <!-- Inner Soft Bezel -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- Heart & Pulse Wave Symbol -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Heart outline -->
    <path d="M 0,130 C -150,40 -200,-60 -120,-130 C -60,-180 0,-110 0,-80 C 0,-110 60,-180 120,-130 C 200,-60 150,40 0,130 Z"
          fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />

    <!-- Dynamic ECG Pulse Wave across center -->
    <polyline points="-170,0 -80,0 -50,-60 -20,80 15,-100 45,40 75,-20 100,0 170,0"
              fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography Badge -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="2">
    BLOODPRESSURE
  </text>
</svg>
